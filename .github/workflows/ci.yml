name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Lint, typecheck, unit tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test:unit

      - name: Build
        run: pnpm build

  api-e2e:
    name: API e2e (${{ matrix.database }})
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        include:
          - database: sqlite
            database_client: better-sqlite3
          - database: postgres
            database_client: pg

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: servico_certo
          POSTGRES_PASSWORD: servico_certo
          POSTGRES_DB: servico_certo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U servico_certo -d servico_certo_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      DATABASE_CLIENT: ${{ matrix.database_client }}
      DATABASE_URL: postgres://servico_certo:servico_certo@localhost:5432/servico_certo_test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: E2E tests
        run: pnpm test:e2e
