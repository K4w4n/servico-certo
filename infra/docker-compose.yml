services:
  postgres:
    image: postgres:17-alpine
    container_name: servico-certo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: servico_certo
      POSTGRES_PASSWORD: servico_certo
      POSTGRES_DB: servico_certo
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U servico_certo -d servico_certo']
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    container_name: servico-certo-mailpit
    restart: unless-stopped
    ports:
      - '1025:1025'
      - '8025:8025'

volumes:
  postgres_data:
